<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>
    <style>
        footer{
            background-color: #1a1a2e;
            color: #ccc;
            text-align: center;
            padding: 30px 20px;
        }

        .social-links{
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .social-links li{
            cursor: pointer;
            transition: 0.3s;
        }

        .social-links li:hover{
            color: #cc0000;
        }

        .footer-contact{
            margin-top: 15px;
            line-height: 1.8;
        }

        .copyright{
            margin-top: 15px;
            color: #777;
            font-size: 14px;
        } 
    </style>
</head>
<body>
      <footer>

        <ul class="social-links">
            <li>Facebook</li>
            <li>Instagram</li>
        </ul>

        <div class="footer-contact">
            <p>Email: alliedbusinesscorp@gmail.com</p>
            <p>Phone: +91 9876543210</p>
        </div>

        <p class="copyright">
            © 2026 Allied Business Corporation
        </p>

    </footer>
</body>
</html>
