{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #001f4d, #003366);
            padding: 20px;
        }

        section{
            width: 400px;
            background-color: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.3);
        }

        .heading{
            text-align: center;
        }

        .heading h3{
            color: #001f4d;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .heading small{
            color: gray;
            font-size: 14px;
        }

        .login-container{
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .login-container input{
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .login-container input:focus{
            border-color: #003366;
            box-shadow: 0px 0px 5px rgba(0,51,102,0.5);
        }

        .login-btn{
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #003366;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover{
            background-color: #001f4d;
        }

        .login-container a{
            text-decoration: none;
            color: #003366;
            font-size: 14px;
            transition: 0.3s;
        }

        .login-container a:hover{
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <main>
        <section>

            <form action="" method="post">
                {% csrf_token %}

                <div class="heading">

                    <h3>Welcome to Allied Business</h3>
                    <small>Trusted Business Center</small>

                    <div class="login-container">

                        <input type="text" placeholder="Full Name" required>

                        <input type="email" placeholder="Email" required>

                        <input type="email" placeholder="Confirm Email" required>

                        <input type="number" placeholder="Mobile Number" required>

                        <input type="password" placeholder="Password" required>

                        <button type="submit" class="login-btn">
                            Register
                        </button>

                        <a href="{% url 'login' %}">
                            Already have an account?
                        </a>

                    </div>

                </div>

            </form>

        </section>
    </main>

</body>
</html>
