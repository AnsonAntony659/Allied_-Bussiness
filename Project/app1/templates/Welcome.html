{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Allied Business Corporation</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
 <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            overflow: hidden;
            position: relative;
            font-family: 'Raleway', sans-serif;
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,160,30,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,160,30,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridShift 20s linear infinite;
        }
        @keyframes gridShift {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
        }
        .glow-orb.one {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255,140,0,0.15) 0%, transparent 70%);
            top: -120px; left: -100px;
            animation: orbDrift 12s ease-in-out infinite alternate;
        }
        .glow-orb.two {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255,80,0,0.1) 0%, transparent 70%);
            bottom: -80px; right: -60px;
            animation: orbDrift 15s ease-in-out infinite alternate-reverse;
        }
        @keyframes orbDrift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 30px); }
        }

        .particles { position: absolute; inset: 0; pointer-events: none; }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,160,30,0.18);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ff9a20;
            border: 1px solid rgba(255,154,32,0.4);
            padding: 6px 20px;
            border-radius: 20px;
            margin-bottom: 1.8rem;
            background: rgba(255,154,32,0.06);
            animation: fadeInUp 1.2s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .headline {
            font-family: 'Playfair Display', serif;
            font-size: clamp(52px, 10vw, 90px);
            font-weight: 700;
            line-height: 1.05;
            color: #fff;
            margin-bottom: 0.4rem;
            animation: fadeInUp 1.2s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .headline .accent {
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(255,154,32,0.7);
        }

        .divider {
            width: 60px; height: 2px;
            background: linear-gradient(90deg, transparent, #ff9a20, transparent);
            margin: 1.4rem auto;
            animation: expandLine 1s 0.7s ease both;
        }
        @keyframes expandLine {
            0% { width: 0; opacity: 0; }
            100% { width: 60px; opacity: 1; }
        }

        .subtext {
            font-size: 16px;
            font-weight: 300;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2.8rem;
            animation: fadeInUp 1.2s 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .btn-wrap {
            animation: fadeInUp 1.2s 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 44px;
            background: linear-gradient(135deg, #ff8c00, #ff5500);
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 32px rgba(255,100,0,0.35);
        }
        .cta-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .cta-btn:hover::before { opacity: 1; }
        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(255,100,0,0.5);
        }
        .cta-btn .arrow { transition: transform 0.3s ease; display: inline-block; }
        .cta-btn:hover .arrow { transform: translateX(5px); }

        .shimmer-line {
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 3s 1.5s ease infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 3.5rem;
            animation: fadeInUp 1.2s 0.95s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .stat { text-align: center; }
        .stat-num {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #ff9a20;
            display: block;
            font-weight: 700;
        }
        .stat-label {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            display: block;
            margin-top: 4px;
        }
        .stat-sep {
            width: 1px;
            background: rgba(255,255,255,0.1);
            align-self: stretch;
        }
 </style>
</head>
<body>

    <div class="grid-overlay"></div>
    <div class="glow-orb one"></div>
    <div class="glow-orb two"></div>
    <div class="particles" id="particles"></div>

    <div class="content">
        <div class="badge">Est. Since 1995</div>
        <h1 class="headline">
            ALLIED<br><span class="accent">BUSINESS  Corporation</span>
        </h1>
        <div class="divider"></div>
        <p class="subtext"> &nbsp;&nbsp; Built for Excellence</p>

        <div class="btn-wrap">
            <a href="{% url 'home' %}" class="cta-btn">
                <div class="shimmer-line"></div>
                Explore Now
                <span class="arrow">→</span>
            </a>
        </div>

        <div class="stats-row">
            <div class="stat">
                <span class="stat-num">28+</span>
                <span class="stat-label">Years Active</span>
            </div>
            <div class="stat-sep"></div>
            <div class="stat">
                <span class="stat-num">500+</span>
                <span class="stat-label">Clients</span>
            </div>
            <div class="stat-sep"></div>
            <div class="stat">
                <span class="stat-num">15+</span>
                <span class="stat-label">Branch</span>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('particles');
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 10 + 4;
            p.style.cssText = `
                width:${size}px;height:${size}px;
                left:${Math.random()*100}%;
                bottom:-20px;
                animation-duration:${Math.random()*12+8}s;
                animation-delay:${Math.random()*10}s;
            `;
            container.appendChild(p);
        }
    </script>
</body>
</html>
