{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #001f4d, #003366);
        }

        section{
            width: 380px;
            background-color: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.3);
        }

        .forgot-password{
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }

        .forgot-password h3{
            color: #001f4d;
            font-size: 30px;
        }

        .forgot-password small{
            color: gray;
            font-size: 14px;
            line-height: 1.5;
        }

        .forgot-password input{
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .forgot-password input:focus{
            border-color: #003366;
            box-shadow: 0px 0px 5px rgba(0,51,102,0.5);
        }

        .forgot-password button{
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #003366;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .forgot-password button:hover{
            background-color: #001f4d;
        }

    </style>

</head>

<body>

    <main>
        <section>

            <form action="{% url 'forgotpassword' %}" method="POST">
                {% csrf_token %}
               
                <div class="forgot-password">
                  <small><a href="{% url 'login' %}"> < Back to login </a></small>

                    <h3>Forgot Password</a></h3>

                    <small>
                        Enter your registered email to receive a reset OTP
                    </small>

                    <input type="email" placeholder="Registered Email">

                    <button type="submit">
                        Verify OTP
                    </button>

                </div>

            </form>

        </section>
    </main>

</body>
</html>
